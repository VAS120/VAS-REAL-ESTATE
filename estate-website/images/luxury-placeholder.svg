<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#141c2e" />
      <stop offset="100%" stop-color="#070a10" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3d07a" />
      <stop offset="50%" stop-color="#c5a059" />
      <stop offset="100%" stop-color="#9d7831" />
    </linearGradient>
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(197, 160, 89, 0.08)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bgGrad)" />
  <rect width="1200" height="800" fill="url(#gridPattern)" />

  <!-- Outer Architectural Framing -->
  <rect x="50" y="50" width="1100" height="700" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-opacity="0.4" />
  <rect x="65" y="65" width="1070" height="670" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1" />

  <!-- Corner Accents -->
  <path d="M 40 70 L 40 40 L 70 40" fill="none" stroke="url(#goldGrad)" stroke-width="4" />
  <path d="M 1130 40 L 1160 40 L 1160 70" fill="none" stroke="url(#goldGrad)" stroke-width="4" />
  <path d="M 40 730 L 40 760 L 70 760" fill="none" stroke="url(#goldGrad)" stroke-width="4" />
  <path d="M 1160 730 L 1160 760 L 1130 760" fill="none" stroke="url(#goldGrad)" stroke-width="4" />

  <!-- Central Crest / Monogram -->
  <g transform="translate(600, 320)">
    <!-- Hexagonal Shield -->
    <polygon points="0,-100 86,-50 86,50 0,100 -86,50 -86,-50" fill="rgba(197,160,89,0.06)" stroke="url(#goldGrad)" stroke-width="3" />
    
    <!-- Building / Villa Icon -->
    <path d="M-40,30 L-40,-20 L0,-55 L40,-20 L40,30 Z" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linejoin="round" />
    <path d="M-20,30 L-20,5 L20,5 L20,30" fill="none" stroke="url(#goldGrad)" stroke-width="2" />
    <line x1="-30" y1="-10" x2="-20" y2="-10" stroke="url(#goldGrad)" stroke-width="2" />
    <line x1="20" y1="-10" x2="30" y2="-10" stroke="url(#goldGrad)" stroke-width="2" />
    <circle cx="0" cy="-30" r="6" fill="url(#goldGrad)" />
  </g>

  <!-- Title & Branding -->
  <text x="600" y="490" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="34" font-weight="700" fill="#ffffff" letter-spacing="4" text-anchor="middle">
    VAS ESTATES LUXURY
  </text>
  <text x="600" y="530" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="16" font-weight="600" fill="url(#goldGrad)" letter-spacing="6" text-anchor="middle">
    REAL ESTATE &bull; ACCRA, GHANA
  </text>
  <text x="600" y="585" font-family="'Montserrat', -apple-system, sans-serif" font-size="14" fill="#9ca3af" letter-spacing="2" text-anchor="middle">
    ARCHITECTURAL PHOTOGRAPHY &amp; 3D ARTWORK PENDING VERIFICATION
  </text>
  <text x="600" y="620" font-family="'Montserrat', -apple-system, sans-serif" font-size="12" fill="rgba(197,160,89,0.7)" letter-spacing="1.5" text-anchor="middle">
    DIRECT BROKER DESK: +233 599 120 927 &bull; VINCENT SOMUAH
  </text>
</svg>

